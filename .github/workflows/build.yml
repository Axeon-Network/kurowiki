name: Build and Deploy

on:
  push:
    branches: [ kuro_sl1 ]
  repository_dispatch:
    types: [ sync-contents ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main repo
        uses: actions/checkout@v4

      - name: Clone media repo
        run: |
          git clone https://x-access-token:${{ secrets.MEDIA_REPO_TOKEN }}@github.com/Axeon-Network/media.git media

      - name: Sync content
        run: |
          rm -rf _articles res/img/articles

          mkdir -p _articles res/img/articles

          rsync -av --delete media/kuro/articles/ _articles/
          rsync -av --delete media/kuro/img/ res/img/articles/

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build site
        run: bundle exec jekyll build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
