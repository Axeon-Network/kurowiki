<!-- Codename Silver -->
{% assign size = include.size | default: 1 %}
<div class="silver-item" style="{% if include.left %}clear:left;float:left;margin-left:0px!important;margin-right:10px!important;{% endif %}{% if size == 1 %}max-width:180px; min-width: 140px;{% endif %}{% if size == 2 %}max-width:220px; min-width:180px;{% endif %}{% if size == 3 %}max-width:260px; min-width:220px;{% endif %}{% if size == 4 %}max-width:300px; min-width:260px;{% endif %}{% if size == 5 %}max-width:350px; min-width:300px;{% endif %}{% if size == 6 %}max-width:370px; min-width:320px;{% endif %}{% if size == 7 %}max-width:400px; min-width:350px;{% endif %}{% if size == 8 %}max-width:420px; min-width:380px;{% endif %}{% if size == 9 %}max-width:450px; min-width:410px;{% endif %}{% if size == 10 %}max-width:500px; min-width:470px;{% endif %}">
    {% assign dirs = nil %}
    <img src="{% if site.img_article_path %}{{ site.baseurl }}/{{ site.img_article_path }}{% endif %}{{ include.image_src }}" title="{{ include.image_src | remove: 'res/img/' | remove: 'res/img/articles/' | remove: '../../img/' }}">
    <a href="{{ site.baseurl }}/{{ site.img_article_path }}{{ include.image_src }}" title='Open file "{{ include.image_src | remove: 'res/img/' | remove: 'res/img/articles/' | remove: '../../img/' }}" in new tab' target="_blank" rel="noopener noreferrer"><span class="material-icons">aspect_ratio</span></a>
    <span class="silver-caption">{{ include.caption | markdownify | remove_first: '<p>' | remove: '</p>' }}</span>
</div>
