<script src="{{ site.baseurl }}/res/qtz/js/cleveland.js"></script>
 <div id="qtz-cleveland" class="qtz-cleveland-hidden">
    <span class="qtz-cleveland-counter"></span>
   
    <div id="qtz-cleveland-top-buttons">
        <button class="qtz-cleveland-opn-btn" target="_blank" rel="noopener noreferrer" title="Open in browser (O)" style="display: block;">
            <i class="material-icons">open_in_new</i>
        </button>
        <button class="qtz-cleveland-dl-btn" title="Download (D)" style="display: block;">
            <i class="material-icons">file_download</i>
        </button>
        <button class="qtz-cleveland-flscr-btn" title="Full Screen (F)">
            <i class="material-icons">fullscreen</i>
        </span>
        <button class="qtz-cleveland-close-btn" title="Close (Escape)">
            <i class="material-icons">close</i>
        </button>
    </div>

    <!-- basically what you see in the center of the drawer -->
    <div class="qtz-cleveland-content">
        <button class="qtz-cleveland-nav-btn qtz-cleveland-prev-btn" title="Previous (Left)">
            <i class="material-icons">chevron_left</i>
        </button>
        <button class="qtz-cleveland-nav-btn qtz-cleveland-next-btn" title="Next (Right)">
            <i class="material-icons">chevron_right</i>
        </button>
        <div id="qtz-cleveland-media-container"></div>
    </div>
    <!-- now here comes the fun part -->
    <div id="qtz-cleveland-details" class="mdl-shadow--8dp">
        <div id="qtz-cleveland-details-nested">
            <h2 id="qtz-cleveland-caption"></h2>
        </div>
        <!-- this was fun to figure out (not) -->
        <button class="qtz-cleveland-button" id="qtz-cleveland-details-button">
            More Details
        </button>
        <div class="mdl-card__actions mdl-card--border" id="qtz-cleveland-details-sub">
            <!-- attribution -->
            <span style="font-size:15px !important;" id="qtz-cleveland-details-author-icon" class="material-icons">people</span>&nbsp;
            <span id="qtz-cleveland-details-author"></span>

            <!-- license -->
            <span class="material-icons" style="font-size:15px !important;position: fixed;bottom: 8;right: 10px;" id="qtz-cleveland-details-license-icon">copyright</span>
            <span id="qtz-cleveland-details-license">{{ site.img_license-s }}</span>
        </div>
    </div>
   

    <!-- its the stupid watermark that covers the bottom details if you're in debug mode! -->
    {% if site.debug %}
    <p id="qtz-cleveland-watermark" class="mdl-shadow--4dp" style="display:block;text-align:right!important;">
        &nbsp;Axeon Quartz "Cleveland" v4.0.{{ PNT_BUILD }}&nbsp;
    </p>
    {% endif %}

    <!-- aight, its the dialog -->
    <!-- i will add the polyfill if there is need for one,
         for now, every browser *should* support the dialog tag -->

    <dialog class="mdl-dialog">
        <h2 class="mdl-dialog__title">More Details</h2>
        <div class="mdl-dialog__content">
            <p>File name: <span id="qtz-cleveland-dialog-filename"></span></p>
            <p>File size: <span id="qtz-cleveland-dialog-filesize"></span></p>
            <p>Resolution: <span id="qtz-cleveland-dialog-resolution"></span></p>
            <p>Uploaded by <span id="qtz-cleveland-dialog-author"></span></p>
            <p>Uploaded on <span id="qtz-cleveland-dialog-uploaddate"></span></p>
            <p>Licensed under <a href="{{ site.img_licenseurl }}">{{ site.img_license }}</a></p>
        </div>

        <!-- this idiot had me going crazy for 3 whole days -->
        <!-- while i've had insomia since like 5 months ago, this made it fucking worse man -neko64 -->
        <div class="mdl-dialog__actions mdl-card--border qtz-cleveland-border">
              <button class="qtz-cleveland-button qtz-cleveland-button-dialogue" id="qtz-cleveland-close-modal">
                Close
            </button>
        </div>
    </dialog>

    <!-- i just straight up copied it from mdl docs, seems to work! -->

    <script>
        const dialog = document.querySelector('dialog');
        const showModalButton = document.getElementById('qtz-cleveland-details-button');
        const closeModal = document.getElementById('qtz-cleveland-close-modal');


        if (! dialog.showModal) {
            dialogPolyfill.registerDialog(dialog);
        }


        showModalButton.addEventListener('click', function() {
            dialog.showModal();
        });

        closeModal.addEventListener('click', function() {
            dialog.close();
        });
    </script>
</div>
