<div class="silver-item">
    <img src="{{ include.image_src }}">
    <a href="{{ include.image_src }}" title='Open "{{ include.image_src | remove: 'resources/img/' }}" in new tab' target="_blank" rel="noopener noreferrer"><span class="material-icons">aspect_ratio</span></a>
    <span class="caption">{{ include.caption | markdownify | remove_first: '<p>' | remove: '</p>' }}</span>
</div>
